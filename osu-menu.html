<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>我的osu!lazer练习</title>
    <link rel="stylesheet" href="menu-base.css">
    <link rel="stylesheet" href="menu.css">
</head>
<body>

    <main id="scene" class="scene">

<div id="menu-band" class="menu-band" hidden>

<button type="button" class="menu-button settings">
    <span class="button-content">
<img src="assets/settings.png" alt="">
<span>设置</span>
    </span>
</button>

<nav id="menu-options" class="menu-options">

<button type="button" class="menu-button play">
    <span class="button-content">
<img src="assets/play.png" alt="">
<span>开始游玩</span>
    </span>
    </button>
     
<button type="button" class="menu-button edit">
    <span class="button-content">
<img src="assets/edit.png" alt="">
<span>编辑</span>
    </span>
</button>

<button type="button" class="menu-button browse">
<span class="button-content">
<img src="assets/browse.png" alt="">
<span>浏览谱面</span>
</span>
</button>

<button type="button" class="menu-button exit">
    <span class="button-content">
        <img src="assets/exit.png" alt="">
        <span>退出</span>
    </span>
</button>
</nav>

</div>

<button type="button" id="logo-button" class="logo-button" aria-label="打开主菜单">
<img src="assets/logo.png" alt="osu!logo">
</button>

    </main>
    
<script>
function showMessage(){
document.getElementById("menu-band").hidden=false;
document.getElementById("scene").classList.add("is-open");
}
document.getElementById("logo-button").addEventListener("click",showMessage);

</script>

</body>
</html>
