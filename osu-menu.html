<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>我的osu!lazer练习</title>
    <link rel="stylesheet" href="menu.css">
    <link rel="stylesheet" href="base.css">
    <link rel="stylesheet" href="sidebar.css">
    <link rel="stylesheet" href="layout-support.css">
    <link rel="stylesheet" href="interaction-support.css">
    
</head>

<body>

    <main id="scene" class="scene">

<audio src="assets/audio/triangles-theme.mp3" class="bgm" ></audio>

        <div id="startup" class="startup">
<div id="startupscreen" class="startupscreen"></div>
  <video src="assets/video/startup-triangles-av.webm" id="startupvideo" class="startupvideo" playsinline preload="auto" muted></video>
        </div>

        <video src="assets/video/seeya-exit-av.webm" id="exitvideo" class="exitvideo" playsinline preload="auto" hidden></video>
      
<div id="sidebar" class="sidebar">

<button id="bsettings" class="sidebar-button bsettings">
    <img src="assets/image/sidebar/settings.png" alt="">
<span id="sidebar-flash" class="sidebar-flash"></span>
</button>

<button id="home" class="sidebar-button home">
    <img src="assets/image/sidebar/home.png" alt="">
<span id="sidebar-flash" class="sidebar-flash"></span>
</button>

 <nav id="mode-band" class="mode-band"> 

<button id="osu!" class="sidebar-button osu!">
    <img src="assets/image/sidebar/ruleset-osu-selected.png" alt="">
<span id="sidebar-flash" class="sidebar-flash"></span>
</button>

<button id="taiko" class="sidebar-button taiko">
    <img src="assets/image/sidebar/ruleset-taiko.png" alt="">
<span id="sidebar-flash" class="sidebar-flash"></span>
</button>

<button id="catch" class="sidebar-button catch">
    <img src="assets/image/sidebar/ruleset-catch.png" alt="">
<span id="sidebar-flash" class="sidebar-flash"></span>
</button>

<button id="mania"  class="sidebar-button mania">
    <img src="assets/image/sidebar/ruleset-mania.png" alt="">
<span id="sidebar-flash" class="sidebar-flash"></span>
</button>

<span id="mode-indicator" class="mode-indicator" aria-hidden="true">
    <span id="mode-line" class="mode-line"></span>
</span>


            </nav>


</div>

        <div id="menu-band" class="menu-band" hidden>

            <button type="button" id="settings" class="menu-button settings">
                <span class="button-background" aria-hidden="true">
                    <span class="button-paint"></span>
                    <span class="button-flash"></span>
                </span>
                <span class="button-content">
                    <img src="assets/image/menu/settings.png" alt="">
                    <span>设置</span>
                </span>
            </button>

            <button type="button" id="play-back" class="menu-button back" hidden>
                <span  class="button-background" aria-hidden="true">
                    <span class="button-paint"></span>
                    <span class="button-flash"></span>
                </span>
                <span class="button-content">
                    <img src="assets/image/menu/back.png" alt="">
                    <span>返回</span>
                </span>
            </button>

           

            <button type="button" id="edit-back" class="menu-button back" hidden>
                <span  class="button-background" aria-hidden="true">
                    <span class="button-paint"></span>
                    <span class="button-flash"></span>
                </span>
                <span class="button-content">
                    <img src="assets/image/menu/back.png" alt="">
                    <span>返回</span>
                </span>
            </button>

            <button type="button" id="multi-back" class="menu-button back" hidden>
                <span  class="button-background" aria-hidden="true">
                    <span class="button-paint"></span>
                    <span class="button-flash"></span>
                </span>
                <span class="button-content">
                    <img src="assets/image/menu/back.png" alt="">
                    <span>返回</span>
                </span>
            </button>

            <nav id="main-menu" class="menu-options">

                <button type="button" id="play" class="menu-button play">
                    <span  class="button-background" aria-hidden="true">
                    <span class="button-paint"></span>
                    <span class="button-flash"></span>
                </span>
                    <span class="button-content">
                        <img src="assets/image/menu/play.png" alt="">
                        <span>开始游玩</span>
                    </span>
                </button>

                <button type="button" id="edit" class="menu-button edit">
                    <span  class="button-background" aria-hidden="true">
                    <span class="button-paint"></span>
                    <span class="button-flash"></span>
                </span>
                    <span class="button-content">
                        <img src="assets/image/menu/edit.png" alt="">
                        <span>编辑</span>
                    </span>
                </button>

                <button type="button" id="browse" class="menu-button browse">
                    <span  class="button-background" aria-hidden="true">
                    <span class="button-paint"></span>
                    <span class="button-flash"></span>
                </span>
                    <span class="button-content">
                        <img src="assets/image/menu/browse.png" alt="">
                        <span>浏览谱面</span>
                    </span>
                </button>

                <button type="button" id="exit" class="menu-button exit">
                    <span class="button-background" aria-hidden="true">
                    <span class="button-paint"></span>
                    <span class="button-flash"></span>
                </span>
                    <span class="button-content">
                        <img src="assets/image/menu/exit.png" alt="">
                        <span>退出</span>
                    </span>
                </button>
            </nav>

            <nav id="play-menu" class="menu-options" hidden>

                <button type="button" id="solo" class="menu-button solo">
                    <span class="button-background" aria-hidden="true">
                    <span class="button-paint"></span>
                    <span class="button-flash"></span>
                </span>
                    <span class="button-content">
                        <img src="assets/image/menu/solo.png" alt="">
                        <span>单人游戏</span>
                    </span>
                </button>

                <button type="button" id="multi" class="menu-button multi">
                    <span class="button-background" aria-hidden="true">
                    <span class="button-paint"></span>
                    <span class="button-flash"></span>
                </span>
                    <span class="button-content">
                        <img src="assets/image/menu/multi.png" alt="">
                        <span>多人游戏</span>
                    </span>
                </button>

                <button type="button" id="playlists" class="menu-button playlists">
                    <span class="button-background" aria-hidden="true">
                    <span class="button-paint"></span>
                    <span class="button-flash"></span>
                </span>
                    <span class="button-content">
                        <img src="assets/image/menu/playlists.png" alt="">
                        <span>歌单模式</span>
                    </span>
                </button>

                <button type="button" id="daily" class="menu-button daily">
                    <span class="button-background" aria-hidden="true">
                    <span class="button-paint"></span>
                    <span class="button-flash"></span>
                </span>
                    <span class="button-content">
                        <img src="assets/image/menu/daily.png" alt="">
                        <span>每日挑战</span>
                    </span>
                </button>

            </nav>

<nav id="edit-menu" class="menu-options" hidden>

                <button type="button" class="menu-button beatmap-editor">
                    <span class="button-background" aria-hidden="true">
                    <span class="button-paint"></span>
                    <span class="button-flash"></span>
                </span>
                    <span class="button-content">
                        <img src="assets/image/menu/beatmap-editor.png" alt="">
                        <span>谱面编辑器</span>
                    </span>
                </button>

                <button type="button" class="menu-button skin-editor">
                    <span class="button-background" aria-hidden="true">
                    <span class="button-paint"></span>
                    <span class="button-flash"></span>
                </span>
                    <span class="button-content">
                        <img src="assets/image/menu/skin-editor.png" alt="">
                        <span>皮肤编辑器</span>
                    </span>
                </button>

            </nav>

            <nav id="multi-menu" class="menu-options" hidden>

                <button type="button" class="menu-button lounge">
                    <span class="button-background" aria-hidden="true">
                    <span class="button-paint"></span>
                    <span class="button-flash"></span>
                </span>
                    <span class="button-content">
                        <img src="assets/image/menu/lounge.png" alt="">
                        <span>大厅</span>
                    </span>
                </button>

                <button type="button" class="menu-button ranked">
                    <span class="button-background" aria-hidden="true">
                    <span class="button-paint"></span>
                    <span class="button-flash"></span>
                </span>
                    <span class="button-content">
                        <img src="assets/image/menu/ranked.png" alt="">
                        <span>排位模式</span>
                    </span>
                </button>

            </nav>

        </div>

        <button type="button" id="logo-button" class="logo-button" disabled aria-label="打开主菜单">
            <span class="logo-fill"></span>
            <img src="assets/image/others/logo.png" alt="osu!logo">
            <span class="logo-flash"></span>
            <video src="assets/video/logo-bars-v2-alpha.webm" class="logo-bar" loop muted playsinline></video>
        </button>


    </main>

    <script src="main.js"></script>

</body>

</html>
